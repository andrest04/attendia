# Local-dev helper only — the app itself still runs via `npm start`, not Compose.
# Spins up Gotenberg (self-hosted LibreOffice-backed PDF conversion, see
# server/gotenbergDocumentConverter.ts) so GET /resources/:id/preview works without
# installing LibreOffice on your machine.
#
# Usage: docker compose up -d
# Then set GOTENBERG_URL=http://localhost:3010 in your .env.
services:
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - '3010:3000'
