name: Trigger auto deployment for attendia

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/attendia-AutoDeployTrigger-186e9ff7-c178-40c8-bbc5-1da8eab9c9f4.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ATTENDIA_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ATTENDIA_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ATTENDIA_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ca1e77e4bf38acr.azurecr.io
          registryUsername: ${{ secrets.ATTENDIA_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ATTENDIA_REGISTRY_PASSWORD }}
          containerAppName: attendia
          resourceGroup: rg-eduspace-academic
          imageToBuild: ca1e77e4bf38acr.azurecr.io/attendia:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


