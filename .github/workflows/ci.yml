name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-focused-tests.js
      - run: npm run lint
      - run: npm run typescript:server
      - run: npm run test:ci
      - run: npm run build
